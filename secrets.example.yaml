# Copy to secrets.yaml (never commit it) and fill in your own values.
wifi_ssid: "my-wifi"
wifi_password: "my-wifi-password"
# Per eTRV: 4-digit PIN (0000 if none is set) and the 32-hex-character secret key, see README
# "Obtaining the secret_key".
kuchnia_pin_code: "0000"
kuchnia_secret_key: "00000000000000000000000000000000"
kanciapamamy_pin_code: "0000"
kanciapamamy_secret_key: "00000000000000000000000000000000"
sypialnia_pin_code: "0000"
sypialnia_secret_key: "00000000000000000000000000000000"
salon_pin_code: "0000"
salon_secret_key: "00000000000000000000000000000000"
# eTRV Bluetooth MAC addresses (Danfoss app: Settings -> System Information, or danfoss_eco_scanner)
kuchnia_mac: "00:04:2F:00:00:01"
kanciapamamy_mac: "00:04:2F:00:00:02"
sypialnia_mac: "00:04:2F:00:00:03"
salon_mac: "00:04:2F:00:00:04"
# used by example_2_home_assistant.yaml
ota_password: "my-ota-password"
fallback_ap_password: "my-fallback-ap-password"
# optional fixed API encryption key (sterownik-grzejnika.yaml, see api:), generate your own with
# python3 -c "import secrets,base64; print(base64.b64encode(secrets.token_bytes(32)).decode())"
# api_encryption_key: "..."
