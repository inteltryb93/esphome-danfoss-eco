# GENERATED from sterownik-grzejnika.yaml (local component source) - edit the production file, not this one.
# ----------------------------------------------------------------------------------------------
# sterownik-grzejnika: ESP32-C3 controlling four Danfoss Eco eTRVs over Bluetooth LE.
#
# Requires ESPHome >= 2026.9.0. Credentials (WiFi, eTRV PIN codes and secret keys) live in
# secrets.yaml, which is NOT in git - see secrets.example.yaml for the keys it must contain (in the
# Home Assistant ESPHome add-on: /config/esphome/secrets.yaml).
#
# Entity names of the existing Home Assistant entities are unchanged (history is kept). Everything
# the eTRVs report over Bluetooth is exposed; see components/danfoss_eco / README for the meaning of
# every entity. Informational values (firmware, serial number, name, schedule, PIN protection) are
# read once after boot, the schedule once a day - they never open a Bluetooth link of their own.
# ----------------------------------------------------------------------------------------------
substitutions:
  display_name: "sterownik-grzejnika"

esphome:
  name: ${display_name}
  min_version: 2026.9.0
  project:
    name: inteltryb93.esphome-danfoss-eco
    version: "2.0.0"

esp32:
  variant: ESP32C3
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  # Same as sterownik-grzejnika.yaml, but built from the component in this working tree.
  - source:
      type: local
      path: components
    components: [danfoss_eco]

esp32_ble:
  # ESP32-C3 Bluedroid host limit: CONFIG_BT_ACL_CONNECTIONS range is 1-9, and ESPHome sets
  # ACL = max_connections + 1, so 8 is the maximum (ACL=9). The component connects to one eTRV at
  # a time, but every ble_client needs its own slot.
  max_connections: 8

esp32_ble_tracker:
  scan_parameters:
    # Passive scanning: the eTRVs are never asked for scan responses (every scan response is an
    # extra radio transmission on the thermostat's battery). Connections only need the MAC address.
    active: false

logger:
  # DEBUG shows one line per BLE link step; set VERBOSE (and esp32_ble_client: DEBUG) for deep
  # debugging of the Bluetooth link.
  level: DEBUG

api:
  # Recommended: encrypt the API (Home Assistant then asks for the key once when re-adding the
  # device). Generate a key with: python3 -c "import secrets,base64; print(base64.b64encode(secrets.token_bytes(32)).decode())"
  # encryption:
  #   key: !secret api_encryption_key

ota:
  - platform: esphome
    # Recommended: protect OTA updates with a password.
    # password: !secret ota_password

# eTRV clock source: keeps the thermostat clocks set and clears their E10 "invalid clock" error
# after a battery change (the weekly schedule / AUTO mode needs a valid clock).
time:
  - platform: homeassistant
    id: ha_time

debug:
  update_interval: 60s

text_sensor:
  - platform: template
    name: "Log Message"
    id: log_message_sensor

  - platform: debug
    device:
      name: "Device Info"
    reset_reason:
      name: "Reset Reason"

binary_sensor:
  - platform: template
    name: "Restart Trigger"
    id: my_boolean_entity
    trigger_on_initial_state: false

button:
  - platform: safe_mode
    name: ${display_name} (Safe Mode)

  - platform: restart
    name: ${display_name} Restart
    id: restart_switch

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # The ESP32-C3 shares one radio between WiFi and Bluetooth: scan only while WiFi is connected.
  on_connect:
    - esp32_ble_tracker.start_scan:
        continuous: true
  on_disconnect:
    - esp32_ble_tracker.stop_scan:

sensor:
  # memory monitoring (a slowly shrinking value would indicate a leak)
  - platform: debug
    free:
      name: "Heap Free"
    block:
      name: "Heap Max Block"

  # Signal strength of the thermostat's advertisements (averaged, one value per 5 minutes)
  - platform: ble_rssi
    mac_address: !secret kuchnia_mac
    id: "RSSI_kuchnia_thermostat"
    name: "RSSI_kuchnia_thermostat"
    accuracy_decimals: 1
    filters:
      - throttle_average: 5min

  # Signal strength of the thermostat's advertisements (averaged, one value per 5 minutes)
  - platform: ble_rssi
    mac_address: !secret kanciapamamy_mac
    id: "RSSI_kanciapamamy_thermostat"
    name: "RSSI_kanciapamamy_thermostat"
    accuracy_decimals: 1
    filters:
      - throttle_average: 5min

  # Signal strength of the thermostat's advertisements (averaged, one value per 5 minutes)
  - platform: ble_rssi
    mac_address: !secret sypialnia_mac
    id: "RSSI_sypialnia_thermostat"
    name: "RSSI_sypialnia_thermostat"
    accuracy_decimals: 1
    filters:
      - throttle_average: 5min

  # Signal strength of the thermostat's advertisements (averaged, one value per 5 minutes)
  - platform: ble_rssi
    mac_address: !secret salon_mac
    id: "RSSI_salon_thermostat"
    name: "RSSI_salon_thermostat"
    accuracy_decimals: 1
    filters:
      - throttle_average: 5min

ble_client:
  - mac_address: !secret kuchnia_mac
    id: kuchnia_thermostat

  - mac_address: !secret kanciapamamy_mac
    id: kanciapamamy_thermostat

  - mac_address: !secret sypialnia_mac
    id: sypialnia_thermostat

  - mac_address: !secret salon_mac
    id: salon_thermostat

climate:
  - platform: danfoss_eco
    name: "kuchnia_thermostat"
    ble_client_id: kuchnia_thermostat
    pin_code: !secret kuchnia_pin_code
    secret_key: !secret kuchnia_secret_key
    time_id: ha_time
    # One short BLE link per poll; commands from Home Assistant are sent immediately anyway.
    update_interval: 720min
    battery_level:
      name: "kuchnia thermostat bateria"
    temperature:
      name: "kuchnia thermostat temperatura"
    problems:
