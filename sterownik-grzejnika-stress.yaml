substitutions:
  display_name: "sterownik-grzejnika"

esphome:
  name: ${display_name}
  platformio_options:
    board_build.mcu: esp32c3
    board_build.variant: esp32c3
    board_build.flash_mode: dio
    board_build.flash_size: 4MB

esp32:
  variant: ESP32C3
  board:  esp32-c3-devkitm-1
  framework:
    type: esp-idf

# Use the locally merged danfoss_eco component (ryssel + ckoca merge).
external_components:
  # DEBUG BUILD: use the local working-tree component (not the GitHub clone)
  - source:
      type: local
      path: components

esp32_ble:
  # ESP32-C3 Bluedroid host limit: CONFIG_BT_ACL_CONNECTIONS range is 1-9, and ESPHome sets
  # ACL = max_connections + 1, so 8 is the maximum (ACL=9). Needed because 4 ble_clients can be
  # triggered to connect simultaneously; the default (3) caused ESP_GATT_ERROR 0x85 on the 4th.
  max_connections: 8


logger:
  level: VERBOSE
  logs:
    esp32_ble_tracker: DEBUG
    esp32_ble: DEBUG
    esp32_ble_client: DEBUG
    ble_client: VERBOSE
    danfoss_eco: VERBOSE
    wifi: DEBUG
    api: DEBUG
    api.connection: DEBUG
    scheduler: INFO
    component: DEBUG
    sensor: INFO
    climate: INFO
    text_sensor: INFO
    binary_sensor: INFO
    debug: INFO


api:

time:
  - platform: homeassistant
    id: ha_time
ota:
  platform: esphome

debug:
  update_interval: 1s


text_sensor:
  - platform: template
    name: "Log Message"
    id: log_message_sensor

  - platform: debug
    device:
      name: "Device Info"
    reset_reason:
      name: "Reset Reason"

binary_sensor:
  - platform: template
    name: "Restart Trigger"
    id: my_boolean_entity
    publish_initial_state: false

button:
  - platform: safe_mode
    name: ${display_name} (Safe Mode)

  - platform: restart
    name: ${display_name} Restart
    id: restart_switch

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    - esp32_ble_tracker.start_scan:
        continuous: true
  on_disconnect:
    - esp32_ble_tracker.stop_scan:

#bluetooth_proxy:
  #  active: False



sensor:

  - platform: template
    id: "RSSI_kanciapamamy_thermostat"
    name: "RSSI_kanciapamamy_thermostat"
    unit_of_measurement: "dBm"
    accuracy_decimals: 1

  - platform: template
    id: "RSSI_sypialnia_thermostat"
    name: "RSSI_sypialnia_thermostat"
    unit_of_measurement: "dBm"
    accuracy_decimals: 1

  - platform: template
    id: "RSSI_kuchnia_thermostat"
    name: "RSSI_kuchnia_thermostat"
    unit_of_measurement: "dBm"
    accuracy_decimals: 1

  - platform: template
    id: "RSSI_salon_thermostat"
    name: "RSSI_salon_thermostat"
    unit_of_measurement: "dBm"
    accuracy_decimals: 1




ble_client:


  - mac_address: !secret kanciapamamy_mac
    id: kanciapamamy_thermostat

  - mac_address: !secret sypialnia_mac
    id: sypialnia_thermostat

  - mac_address: !secret kuchnia_mac
    id: kuchnia_thermostat

  - mac_address: !secret salon_mac
    id: salon_thermostat

  # STRESS TEST ONLY: a thermostat that does not exist (never answers) - exercises the
  # open-failure / back-off / retry-window / parking paths permanently.
  - mac_address: 00:04:2f:00:00:01
    id: fake_thermostat

climate:
  - platform: danfoss_eco
    name: "kuchnia_thermostat"
    time_id: ha_time
    connection:
      name: "kuchnia_thermostat connection"
    ble_client_id: kuchnia_thermostat
    pin_code: !secret kuchnia_pin_code
    secret_key: !secret kuchnia_secret_key
    battery_level:
      name: "kuchnia thermostat bateria"
    temperature:
      name: "kuchnia thermostat temperatura"
    update_interval: 720min
    problems:
      name: "kuchnia_thermostat Problems"



  - platform: danfoss_eco
    name: "kanciapamamy_thermostat"
    time_id: ha_time
    connection:
      name: "kanciapamamy_thermostat connection"
    ble_client_id: kanciapamamy_thermostat
    pin_code: !secret kanciapamamy_pin_code
    secret_key: !secret kanciapamamy_secret_key
    battery_level:
      name: "kanciapamamy bateria"
    temperature:
      name: "kanciapamamy_temperature"
    update_interval: 720min
    problems:
      name: "kanciapamamy_thermostat Problems"

  - platform: danfoss_eco
    name: "sypialnia_thermostat"
    time_id: ha_time
    connection:
      name: "sypialnia_thermostat connection"
    ble_client_id: sypialnia_thermostat
    pin_code: !secret sypialnia_pin_code
    secret_key: !secret sypialnia_secret_key
    battery_level:
      name: "sypialnia_thermostat bateria"
    temperature:
      name: "sypialnia_thermostat temperatura"
    update_interval: 720min
    problems:
      name: "sypialnia_thermostat Problems"

  - platform: danfoss_eco
    name: "salon_thermostat"
    time_id: ha_time
    connection:
      name: "salon_thermostat connection"
    ble_client_id: salon_thermostat
    pin_code: !secret salon_pin_code
    secret_key: !secret salon_secret_key
    battery_level:
      name: "salon_thermostat bateria"
    temperature:
      name: "salon_thermostat temperatura"
    update_interval: 720min
    problems:
      name: "salon_thermostat Problems"

  - platform: danfoss_eco
    name: "fake_thermostat"
    time_id: ha_time
    connection:
      name: "fake_thermostat connection"
    ble_client_id: fake_thermostat
    pin_code: "0000"
    secret_key: 00112233445566778899aabbccddeeff
    update_interval: 5min
    retry_window: 3min
