# Several eTRVs on one ESP32: the component connects to one eTRV at a time.
# Credentials come from secrets.yaml (see secrets.example.yaml).
esphome:
  name: etrv2wifi
  comment: Extend Danfoss ECO eTRV BLE range over WiFi with ESPHome
  min_version: 2026.9.0

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: git
      url: https://github.com/inteltryb93/esphome-danfoss-eco
    components: [danfoss_eco]

esp32_ble:
  max_connections: 3  # at least the number of eTRVs

esp32_ble_tracker:
  scan_parameters:
    active: false  # passive scanning spares the eTRV batteries

time:
  - platform: homeassistant
    id: ha_time

ble_client:
  - mac_address: 00:04:2F:AA:BB:01  # your eTRV's MAC (Danfoss app or danfoss_eco_scanner)
    id: room_eco2
  - mac_address: 00:04:2F:AA:BB:02
    id: kitchen_eco2

climate:
  - platform: danfoss_eco
    name: "My Room eTRV"
    ble_client_id: room_eco2
    secret_key: deadbeefcafebabedeadbeefcafebabe
    time_id: ha_time
    battery_level:
      name: "My Room eTRV Battery Level"
    problems:
      name: "My Room eTRV Problems"
    update_interval: 15min
  - platform: danfoss_eco
    name: "My Kitchen eTRV"
    ble_client_id: kitchen_eco2
    secret_key: deadbeefcafebabedeadbeefcafebabe
    time_id: ha_time
    battery_level:
      name: "My Kitchen eTRV Battery Level"
    problems:
      name: "My Kitchen eTRV Problems"
    update_interval: 16min
